<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Checklists</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: fit-content;
      min-height: 500px;
    }

    /* Tela de Auth */
    .auth-screen {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
      flex-grow: 1;
    }

    .auth-screen h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, background-color 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-secondary { background: var(--border); color: var(--text-main); }

    .auth-toggle {
      text-align: center;
      font-size: 0.875rem;
      color: var(--primary);
      cursor: pointer;
      margin-top: 8px;
      text-decoration: underline;
    }

    /* Cabecalho da App */
    .app-header {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info {
      font-size: 0.875rem;
      font-weight: 600;
    }

    .status-toast {
      font-size: 0.75rem;
      color: var(--success);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .status-toast.visible { opacity: 1; }

    /* Navegação de Abas */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Conteudo */
    .tab-content {
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .tab-content.active { display: flex; }

    /* Item de Checklist */
    .item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .item-row input[type="text"] {
      flex: 1;
    }

    /* Aba Execução */
    .progress-container {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar-bg {
      height: 10px;
      background: var(--border);
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.85rem;
      font-weight: 600;
      text-align: right;
      color: var(--text-muted);
    }

    .check-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .check-item:hover { background: #f8fafc; }

    .check-item.checked {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .check-item.checked span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .check-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--success);
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- TELA DE AUTENTICAÇÃO -->
  <div id="authScreen" class="auth-screen">
    <h2 id="authTitle">Acessar Conta</h2>
    <div class="form-group">
      <label for="username">Usuário</label>
      <input type="text" id="username" placeholder="Digite seu usuário">
    </div>
    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Digite sua senha">
    </div>
    <button class="btn btn-primary" id="btnAuthSubmit" onclick="handleAuth()">Entrar</button>
    <div class="auth-toggle" id="authToggle" onclick="toggleAuthMode()">Não tem conta? Cadastre-se</div>
  </div>

  <!-- INTERFACE PRINCIPAL DA SPA -->
  <div id="mainApp" class="hidden">
    
    <header class="app-header">
      <div>
        <span class="user-info" id="displayUsername">@usuario</span>
        <div id="saveToast" class="status-toast">✓ Salvo automaticamente</div>
      </div>
      <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="logout()">Sair</button>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" onclick="switchTab('editTab')">1. Criação / Edição</button>
      <button class="tab-btn" onclick="switchTab('runTab')">2. Marcação</button>
    </nav>

    <!-- ABA 1: CRIAÇÃO / EDIÇÃO -->
    <section id="editTab" class="tab-content active">
      <div class="form-group">
        <label for="editSelect">Selecionar Checklist</label>
        <select id="editSelect" onchange="loadChecklistForEdit()"></select>
      </div>

      <div class="form-group">
        <label for="checklistTitle">Título do Checklist</label>
        <input type="text" id="checklistTitle" placeholder="Ex: Checklist de Viagem" oninput="triggerAutosave()">
      </div>

      <div class="form-group">
        <label>Itens do Checklist</label>
        <div id="itemsEditorList"></div>
      </div>

      <button class="btn btn-secondary" onclick="addItemField()">+ Adicionar Item</button>
      <hr style="border: none; border-top: 1px solid var(--border); margin: 8px 0;">
      <button class="btn btn-danger" onclick="deleteCurrentChecklist()">Excluir Checklist</button>
    </section>

    <!-- ABA 2: MARCAÇÃO -->
    <section id="runTab" class="tab-content">
      <div class="form-group">
        <label for="runSelect">Escolher Checklist para Executar</label>
        <select id="runSelect" onchange="renderRunner()"></select>
      </div>

      <div id="runnerContainer" class="hidden">
        <div class="progress-container">
          <div class="progress-bar-bg">
            <div id="progressBarFill" class="progress-bar-fill"></div>
          </div>
          <div id="progressText" class="progress-text">0/0 (0%)</div>
        </div>

        <div id="runnerList" style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;"></div>

        <button class="btn btn-secondary" style="margin-top: 16px;" onclick="resetCurrentChecklist()">Desmarcar Todos os Itens</button>
      </div>

      <div id="emptyState" class="empty-state hidden">
        Nenhum checklist disponível. Crie um na aba "Criação / Edição".
      </div>
    </section>

  </div>

</div>

<script>
  /* ==========================================================================
     CONFIGURAÇÃO E ESTADO GLOBAL
     ========================================================================== */
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcYVNZ5tDSXqFT5ALqSsrpmwdBBgdYVa5A_oMe4dR43fiOU7aY1Jyga1xNMHCnHA9g6g/exec"; 

  const STORAGE_KEY = 'app_checklists_data_v1';
  let currentUser = null;
  let isRegisterMode = false;
  let currentChecklists = [];
  let selectedChecklistId = null;
  let autosaveTimeout = null;

  /* ==========================================================================
     SEGURANÇA E SANITIZAÇÃO (XSS Prevention)
     ========================================================================== */
  function sanitizeHTML(str) {
    const temp = document.createElement('div');
    temp.textContent = str;
    return temp.innerHTML;
  }

  /* ==========================================================================
     AUTENTICAÇÃO & NAVEGAÇÃO
     ========================================================================== */
  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('authTitle').innerText = isRegisterMode ? "Criar Nova Conta" : "Acessar Conta";
    document.getElementById('btnAuthSubmit').innerText = isRegisterMode ? "Cadastrar e Entrar" : "Entrar";
    document.getElementById('authToggle').innerText = isRegisterMode ? "Já tem conta? Faça Login" : "Não tem conta? Cadastre-se";
  }

  function handleAuth() {
    const userVal = document.getElementById('username').value.trim();
    const passVal = document.getElementById('password').value.trim();

    if (!userVal || !passVal) {
      alert("Por favor, preencha o usuário e a senha.");
      return;
    }

    currentUser = userVal.toLowerCase();
    document.getElementById('displayUsername').innerText = `@${currentUser}`;

    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');

    loadUserData();
  }

  function logout() {
    currentUser = null;
    currentChecklists = [];
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('mainApp').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    event.currentTarget.classList.add('active');
    document.getElementById(tabId).classList.add('active');

    if (tabId === 'runTab') {
      populateRunnerDropdown();
      renderRunner();
    }
  }

  /* ==========================================================================
     GERENCIAMENTO DE DADOS (LocalStorage + Google Sheets Sync)
     ========================================================================== */
  function getStorageData() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }

  function loadUserData() {
    const allData = getStorageData();
    currentChecklists = allData[currentUser] || [];
    populateEditDropdown();
    loadChecklistForEdit();
    
    syncFromGoogleSheets();
  }

  function saveUserData() {
    const allData = getStorageData();
    allData[currentUser] = currentChecklists;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    showToast();

    syncToGoogleSheets();
  }

  function showToast() {
    const toast = document.getElementById('saveToast');
    toast.classList.add('visible');
    clearTimeout(autosaveTimeout);
    autosaveTimeout = setTimeout(() => toast.classList.remove('visible'), 2000);
  }

  /* Integracao Google Sheets */
  function syncToGoogleSheets() {
    if (!GOOGLE_SCRIPT_URL) return;
    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: currentUser, checklists: currentChecklists })
    }).catch(err => console.error("Erro na sincronização:", err));
  }

  function syncFromGoogleSheets() {
    if (!GOOGLE_SCRIPT_URL) return;
    fetch(`${GOOGLE_SCRIPT_URL}?user=${currentUser}`)
      .then(res => res.json())
      .then(data => {
        if (data && data.checklists) {
          currentChecklists = data.checklists;
          saveUserData();
          populateEditDropdown();
          loadChecklistForEdit();
        }
      })
      .catch(err => console.log("Modo offline / sem resposta do Sheets"));
  }

  /* ==========================================================================
     ABA 1: CRIAÇÃO E EDIÇÃO
     ========================================================================== */
  function populateEditDropdown() {
    const select = document.getElementById('editSelect');
    select.innerHTML = '<option value="NEW">[+ Criar Novo Checklist]</option>';
    
    currentChecklists.forEach(cl => {
      const opt = document.createElement('option');
      opt.value = cl.id;
      opt.textContent = cl.title || "Sem título";
      select.appendChild(opt);
    });

    if (selectedChecklistId) {
      select.value = selectedChecklistId;
    }
  }

  function loadChecklistForEdit() {
    const selectValue = document.getElementById('editSelect').value;
    const itemsList = document.getElementById('itemsEditorList');
    itemsList.innerHTML = '';

    if (selectValue === 'NEW') {
      selectedChecklistId = null;
      document.getElementById('checklistTitle').value = '';
      addItemField();
    } else {
      selectedChecklistId = selectValue;
      const cl = currentChecklists.find(c => c.id === selectedChecklistId);
      if (cl) {
        document.getElementById('checklistTitle').value = cl.title;
        cl.items.forEach(item => addItemField(item.id, item.text));
      }
    }
  }

  function addItemField(id = null, text = '') {
    const itemId = id || 'item_' + Date.now() + Math.random().toString(36).substr(2, 4);
    const container = document.getElementById('itemsEditorList');

    const row = document.createElement('div');
    row.className = 'item-row';
    row.dataset.id = itemId;

    row.innerHTML = `
      <input type="text" value="${sanitizeHTML(text)}" placeholder="Descrição do item" oninput="triggerAutosave()">
      <button class="btn btn-danger" style="padding: 10px 14px;" onclick="removeItemField(this)">✕</button>
    `;

    container.appendChild(row);
    if (!id) triggerAutosave();
  }

  function removeItemField(btnElement) {
    btnElement.parentElement.remove();
    triggerAutosave();
  }

  function triggerAutosave() {
    const titleVal = document.getElementById('checklistTitle').value.trim();
    const rows = document.querySelectorAll('#itemsEditorList .item-row');
    
    if (!titleVal && rows.length === 0) return;

    const items = [];
    rows.forEach(row => {
      const text = row.querySelector('input[type="text"]').value;
      items.push({
        id: row.dataset.id,
        text: text,
        checked: false
      });
    });

    if (!selectedChecklistId) {
      selectedChecklistId = 'cl_' + Date.now();
      currentChecklists.push({
        id: selectedChecklistId,
        title: titleVal || "Novo Checklist",
        items: items
      });
      populateEditDropdown();
    } else {
      const cl = currentChecklists.find(c => c.id === selectedChecklistId);
      if (cl) {
        cl.title = titleVal || "Sem título";
        cl.items = items.map(newItem => {
          const existing = cl.items.find(i => i.id === newItem.id);
          return { ...newItem, checked: existing ? existing.checked : false };
        });
      }
    }

    saveUserData();
    const select = document.getElementById('editSelect');
    const opt = select.querySelector(`option[value="${selectedChecklistId}"]`);
    if (opt) opt.textContent = titleVal || "Sem título";
  }

  function deleteCurrentChecklist() {
    if (!selectedChecklistId || selectedChecklistId === 'NEW') return;

    if (confirm("Tem certeza que deseja excluir este checklist permanentemente?")) {
      currentChecklists = currentChecklists.filter(c => c.id !== selectedChecklistId);
      selectedChecklistId = null;
      saveUserData();
      populateEditDropdown();
      loadChecklistForEdit();
    }
  }

  /* ==========================================================================
     ABA 2: EXECUÇÃO (MARCAÇÃO)
     ========================================================================== */
  function populateRunnerDropdown() {
    const select = document.getElementById('runSelect');
    select.innerHTML = '';

    if (currentChecklists.length === 0) {
      document.getElementById('runnerContainer').classList.add('hidden');
      document.getElementById('emptyState').classList.remove('hidden');
      return;
    }

    document.getElementById('emptyState').classList.add('hidden');
    document.getElementById('runnerContainer').classList.remove('hidden');

    currentChecklists.forEach(cl => {
      const opt = document.createElement('option');
      opt.value = cl.id;
      opt.textContent = cl.title;
      select.appendChild(opt);
    });
  }

  function renderRunner() {
    const selectVal = document.getElementById('runSelect').value;
    const runnerList = document.getElementById('runnerList');
    runnerList.innerHTML = '';

    const cl = currentChecklists.find(c => c.id === selectVal);
    if (!cl) return;

    cl.items.forEach(item => {
      const div = document.createElement('div');
      div.className = `check-item ${item.checked ? 'checked' : ''}`;
      div.onclick = (e) => {
        if (e.target.tagName !== 'INPUT') {
          const chk = div.querySelector('input');
          chk.checked = !chk.checked;
          toggleItemCheck(cl.id, item.id, chk.checked);
        }
      };

      div.innerHTML = `
        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItemCheck('${cl.id}', '${item.id}', this.checked)">
        <span>${sanitizeHTML(item.text)}</span>
      `;

      runnerList.appendChild(div);
    });

    updateProgressBar(cl);
  }

  function toggleItemCheck(checklistId, itemId, isChecked) {
    const cl = currentChecklists.find(c => c.id === checklistId);
    if (cl) {
      const item = cl.items.find(i => i.id === itemId);
      if (item) item.checked = isChecked;
      saveUserData();
      renderRunner();
    }
  }

  function updateProgressBar(checklist) {
    const total = checklist.items.length;
    const checkedCount = checklist.items.filter(i => i.checked).length;
    const percentage = total === 0 ? 0 : Math.round((checkedCount / total) * 100);

    document.getElementById('progressBarFill').style.width = `${percentage}%`;
    document.getElementById('progressText').innerText = `${checkedCount}/${total} (${percentage}%)`;
  }

  function resetCurrentChecklist() {
    const selectVal = document.getElementById('runSelect').value;
    const cl = currentChecklists.find(c => c.id === selectVal);

    if (cl && confirm("Deseja desmarcar todos os itens deste checklist?")) {
      cl.items.forEach(i => i.checked = false);
      saveUserData();
      renderRunner();
    }
  }
</script>

</body>
</html>
